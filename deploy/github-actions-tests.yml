# GitHub Actions: her push'ta testleri çalıştırır.
# Etkinleştirmek için bu dosyayı .github/workflows/tests.yml konumuna taşı (Finder ile, sonra commit).
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q   # offline tests: no network, no API keys
